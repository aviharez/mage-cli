kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  annotations:
    app.openshift.io/vcs-ref: DEV1
    app.openshift.io/vcs-uri: 'https://bcagitlab.intra.bca.co.id/mybcabisnis-web/framework/mage.git'
  name: mage
  labels:
    app: mage
spec:
  # lookupPolicy.local=false: pods reference the image via the trigger annotation
  # (image.openshift.io/triggers on the Deployment), not via the IS name directly.
  # The trigger controller resolves the ISTag → internal digest and patches the
  # container image field automatically on each `podman push`.
  lookupPolicy:
    local: false
